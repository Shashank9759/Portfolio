<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shashank Ranjan - Android and Multiplatform Developer. Portfolio showcasing Kotlin, Jetpack Compose, KMP, and mobile development expertise.">
    <meta name="keywords" content="Android Developer, Kotlin, Jetpack Compose, Kotlin Multiplatform, Compose Multiplatform, Mobile Developer, Freelance">
    <meta name="author" content="Shashank Ranjan">
    <meta property="og:title" content="Shashank Ranjan | Mobile Developer Portfolio">
    <meta property="og:description" content="Android and Multiplatform Developer specializing in Kotlin, Jetpack Compose, and KMP.">
    <meta property="og:type" content="website">
    <title>Shashank Ranjan | Mobile Developer Portfolio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>SR</text></svg>">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0B0F1A;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #F1F5F9;
            background-color: #0B0F1A;
            z-index: 10;
            transition: opacity 0.2s ease;
        }
        #loading .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(129, 140, 248, 0.2);
            border-top-color: #818CF8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #ComposeTarget {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #ComposeTarget canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }
    </style>
</head>
<body>
<div id="loading">
    <div class="spinner"></div>
    <p>Loading Portfolio...</p>
</div>
<div id="ComposeTarget"></div>
<script type="application/javascript" src="portfolio.js" defer></script>
<script>
    function hideLoader() {
        const loader = document.getElementById('loading');
        if (loader && loader.style.display !== 'none') {
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 200);
        }
    }

    const container = document.getElementById('ComposeTarget');
    const observer = new MutationObserver(() => {
        const canvas = container.querySelector('canvas');
        if (canvas) {
            hideLoader();
            observer.disconnect();
        }
    });
    observer.observe(container, { childList: true, subtree: true });

    window.addEventListener('load', () => setTimeout(hideLoader, 12000));
</script>
</body>
</html>
